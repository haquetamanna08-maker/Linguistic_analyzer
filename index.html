<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Linguistic Marketing Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 40px; }
        .card { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background-color: #0056b3; }
        .results { margin-top: 25px; background: #eef2f7; padding: 20px; border-radius: 8px; border-left: 5px solid #007bff; }
        .metric { margin-bottom: 10px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Linguistic & Sentiment Marketing Analyzer</h2>
        <form method="POST">
            <label for="marketing_text"><strong>Paste your marketing copy or ad text:</strong></label><br><br>
            <textarea id="marketing_text" name="marketing_text" placeholder="e.g., Our innovative software helps teams collaborate seamlessly and boost productivity effortlessly!" required></textarea>
            <button type="submit">Analyze Content</button>
        </form>

        {% if result %}
        <div class="results">
            <h3>Analysis Results</h3>
            <div class="metric"><strong>Word Count:</strong> {{ result.word_count }}</div>
            <div class="metric"><strong>Sentiment Polarity (-1 to +1):</strong> {{ result.polarity }}</div>
            <div class="metric"><strong>Subjectivity (0 to 1):</strong> {{ result.subjectivity }}</div>
            <div class="metric"><strong>Flesch Readability Score:</strong> {{ result.readability }} / 100</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
